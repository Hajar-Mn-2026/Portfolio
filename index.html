<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hajar Mennani — Portfolio Data</title>

  <style>
    :root{
      --bg0:#070712;
      --bg1:#0B0A1A;
      --panel: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.10);
      --text:#F3F4FF;
      --muted:#B8B8CC;

      --violet:#7C3AED;
      --violet2:#A78BFA;

      --shadow: 0 18px 45px rgba(0,0,0,0.45);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color: var(--text);
      background:
        radial-gradient(850px 520px at 18% 12%, rgba(124,58,237,0.28), transparent 55%),
        radial-gradient(700px 450px at 78% 18%, rgba(167,139,250,0.18), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    .wrap{
      max-width: 1050px;
      margin: 0 auto;
      padding: 42px 18px 70px;
    }

    /* Header */
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 18px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(0,0,0,0.30);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 220px;
    }

    .dot{
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--violet2), var(--violet));
      box-shadow: 0 12px 30px rgba(124,58,237,0.25);
    }

    .brand strong{
      display:block;
      font-size: 14px;
      letter-spacing: .2px;
    }
    .brand span{
      display:block;
      font-size: 12px;
      color: var(--muted);
      margin-top:2px;
    }

    nav{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content:flex-end;
    }

    nav a{
      text-decoration:none;
      color: var(--text);
      font-weight: 650;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
    }
    nav a:hover{
      border-color: rgba(167,139,250,0.28);
    }

    /* Hero */
    .hero{
      margin-top: 18px;
      display:grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 18px;
      align-items:start;
    }

    .card{
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .hero-left{
      padding: 22px;
    }

    h1{
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: .2px;
      line-height: 1.1;
    }

    .line{
      width: 120px;
